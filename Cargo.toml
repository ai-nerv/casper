[package]
name = "casper"
version = "0.8.0"
edition = "2024"
description = "The tooling interface: what a tool is, what it says, and what it shows"
license = "MIT"
readme = "README.md"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "casper"
path = "src/main.rs"

# Nothing that knows what a harness is. casper is asked to run a tool and to describe what it
# produced; who asked, and what they will do with it, is not its business. What crosses does so as
# data on a pipe -- see `DESIGN.md`.
[dependencies]
# A screen a real program runs in. Two small crates, neither of which knows what a harness is:
# one allocates a pty and puts a child on it, the other reads the bytes that come back as a grid
# of cells. Writing either by hand would mean `unsafe` in a crate that denies it.
pty-process = "0.5"
vt100 = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
ciborium = "0.2"
anyhow = "1"
luna = { git = "https://github.com/onix-os/luna", tag = "v0.5.0", version = "0.5.0" }
thiserror = "2.0"
# The kernel's half of "casper belongs to the magi that started it": `PR_SET_PDEATHSIG`, and
# nothing else from it. Already in the lockfile underneath pty-process, so this is a feature
# and not a package.
rustix = { version = "1", features = ["process", "net", "fs", "event"] }
seccompiler = "0.5"
libc = "0.2.189"
landlock = "0.4.4"
# What `read`, `write` and `edit` show, in the file's own language: Sublime's grammars, read as
# regexes, so no language is compiled in and none needs a program on the machine.
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
# bat's own grammars on top of syntect's: TOML, Nix, TypeScript and the rest a project is made of.
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "client", "transport-io", "transport-streamable-http-client-reqwest", "reqwest"] }
mcp-http = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
# An MCP server's SSE stream, read one capped event at a time.
sse-stream = "0.2.6"
futures = "0.3.34"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "process", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
scraper = "0.24"
url = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# What `code` parses a source file with, inside the jail: the grammars maki's index tool reads.
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-clojure-orchard = "0.2.8"
tree-sitter-containerfile = "0.9.2"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-dart = "0.2.0"
tree-sitter-elixir = "0.3"
tree-sitter-gleam = "1.0"
tree-sitter-go = "0.25"
tree-sitter-hcl = "1.1"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-json = "0.24"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-lua = "0.5"
tree-sitter-make = "1.1"
tree-sitter-md = "0.5"
tree-sitter-nix = "0.3.0"
tree-sitter-php = "0.24"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-sequel = "0.3"
tree-sitter-starlark = "1.3"
tree-sitter-swift = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-vlang = "0.1"
tree-sitter-yaml = "0.7.2"
tree-sitter-zig = "1.1"
# The Python `execute` runs: an interpreter with no filesystem, network or imports of its own,
# run in-process. Whatever a script reaches, it reaches through casper's own tools.
monty = { git = "https://github.com/pydantic/monty.git", tag = "v0.0.23", version = "0.0.23" }
monty-types = { git = "https://github.com/pydantic/monty.git", tag = "v0.0.23", version = "0.0.23" }

[dev-dependencies]
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-server"] }
axum = "0.8"
# The loopback HTTPS listener a jailed fetch is proven against; already in the lockfile under reqwest.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# The same gate the siblings are written under.
[lints.rust]
unsafe_code = "deny"
# A dependency nothing uses is a lie about the graph — an edge that exists in `Cargo.toml`, in
# the lockfile and in every diagram somebody draws from them, and nowhere in the code. Nine of
# them were declared across this family.
#
# Enforced by `cargo machete` in `verify`, not by `unused_crate_dependencies`. That lint finds
# the same thing and then finds a great deal more: it runs per *target*, so every integration
# test is reported for every dev-dependency that one file happens not to name — twenty-odd
# warnings here, none of them a lie, and `clippy -Dwarnings` fails on all of them. machete reads
# the manifest against the whole package and has no such blind spot.
unused = { level = "deny", priority = -1 }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"

[profile.release]
overflow-checks = true
