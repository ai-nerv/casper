[package]
name = "casper"
version = "0.9.1"
edition = "2024"
description = "The tooling interface: what a tool is, what it says, and what it shows"
license = "MIT"
readme = "README.md"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "casper"
path = "src/main.rs"

[[test]]
name = "event_tools"
harness = false

[[test]]
name = "event_servers"
harness = false

# Nothing that knows what a harness is. casper is asked to run a tool and to describe what it
# produced; who asked, and what they will do with it, is not its business. What crosses does so as
# data on a pipe -- see `DESIGN.md`.
[dependencies]
# A screen a real program runs in. Two small crates, neither of which knows what a harness is:
# one allocates a pty and puts a child on it, the other reads the bytes that come back as a grid
# of cells. Writing either by hand would mean `unsafe` in a crate that denies it.
pty-process = "0.5"
vt100 = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
ciborium = "0.2"
anyhow = "1"
luna = { git = "https://github.com/onix-os/luna", tag = "v0.5.0", version = "0.5.0" }
thiserror = "2.0"
# The kernel's half of "casper belongs to the magi that started it": `PR_SET_PDEATHSIG`, and
# nothing else from it. Already in the lockfile underneath pty-process, so this is a feature
# and not a package.
rustix = { version = "1", features = ["process", "net", "fs", "event", "stdio"] }
seccompiler = "0.5"
libc = "0.2.189"
landlock = "0.4.4"
# What `read`, `write` and `edit` show, in the file's own language: Sublime's grammars, read as
# regexes, so no language is compiled in and none needs a program on the machine.
syntect = { version = "5", default-features = false, features = ["parsing", "regex-fancy"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "client", "transport-io", "transport-streamable-http-client-reqwest"] }
# An MCP server's SSE stream, read one capped event at a time.
sse-stream = "0.2.6"
futures = "0.3.34"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "process", "time", "signal"] }
# One HTTP client for `web` and MCP, the one rmcp uses, on one TLS provider: ring, installed at
# startup. `web` trusts the bundled Mozilla roots, MCP the platform's.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "stream", "gzip", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = { version = "=0.17.14", default-features = false, features = ["alloc"] }
webpki-roots = "1"
scraper = "0.24"
url = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# No grammar is linked in: `code` runs a program per language that `casper grammar` builds from
# Helix's pinned list. See `grammars.lock`.
# The Python `execute` runs: an interpreter with no filesystem or network of its own, run
# in-process. Whatever a script reaches, it reaches through casper's own tools.
monty = { git = "https://github.com/pydantic/monty.git", tag = "v1.0.1", version = "1.0.1" }
monty-types = { git = "https://github.com/pydantic/monty.git", tag = "v1.0.1", version = "1.0.1" }

# bat's grammars, as two-face ships them, cut down by `build.rs` to the languages highlighted.
[build-dependencies]
syntect = { version = "5", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
serde_json = "1.0"

[dev-dependencies]
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-server"] }
axum = "0.8"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

# The same gate the siblings are written under.
[lints.rust]
unsafe_code = "deny"
# A dependency nothing uses is a lie about the graph — an edge that exists in `Cargo.toml`, in
# the lockfile and in every diagram somebody draws from them, and nowhere in the code. Nine of
# them were declared across this family.
#
# Enforced by `cargo machete` in `verify`, not by `unused_crate_dependencies`. That lint finds
# the same thing and then finds a great deal more: it runs per *target*, so every integration
# test is reported for every dev-dependency that one file happens not to name — twenty-odd
# warnings here, none of them a lie, and `clippy -Dwarnings` fails on all of them. machete reads
# the manifest against the whole package and has no such blind spot.
unused = { level = "deny", priority = -1 }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
strip = true
